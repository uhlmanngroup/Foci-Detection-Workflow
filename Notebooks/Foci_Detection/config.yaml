# ===============================================================
# FOCI DETECTION PIPELINE CONFIGURATION
# ===============================================================
# Controls automated detection and quantification of fluorescent foci
# in multi-channel microscopy images.
#
# WORKFLOW: Load images → Calibrate parameters (optional) → 
#           Detect foci → Measure properties → Export to CSV
#
# For detailed explanations, see README.md and SOP documentation.
# ===============================================================


# ===============================================================
# DATA INPUT
# ===============================================================
data:
  # Path to folder containing microscopy images
  # Required files per image position:
  #   *_TRITC_SEM.tif, *_FITC_SEM.tif, *_Cy5_SEM.tif
  #   *_DAPI_SEM.tif, *_DAPI_SEM_seg.npy
  folder_path: "Y:\\Group Members\\Valentin Aubry\\01_Data\\Final_Test"


# ===============================================================
# PARAMETER SPACE
# ===============================================================
# Defines valid detection parameter combinations.
# Generate new spaces when starting a new experiment type.
# Reuse existing spaces for same imaging conditions.
# ===============================================================
parameter_space:
  # Generate new parameter spaces via interactive annotation?
  # true:  Manually annotate nuclei, generate new spaces
  # false: Load existing spaces from paths below
  generate_new: true
  
  # Paths to existing parameter space directories
  tritc_path: "Y:\\Group Members\\Valentin Aubry\\01_Data\\Parameters\\Complete_KDE\\TRITC_parameter_space"
  fitc_path: "Y:\\Group Members\\Valentin Aubry\\01_Data\\Parameters\\Complete_KDE\\FITC_parameter_space"
  
  # Number of parameter combinations to test
  # Uses farthest-point sampling from valid parameter space
  # Higher = more thorough but slower
  n_samples: 256
  
  # Internal: Sobol samples for parameter space generation
  # Must be power of 2 (e.g., 32768, 65536, 131072)
  # Increase if you see "Insufficient valid points" errors
  n_sobol_samples: 65536


# ===============================================================
# ADAPTIVE PARAMETER SELECTION
# ===============================================================
# Learns optimal parameters from calibration images, then uses
# only the best 1-3 parameters for remaining images.
# Result: Much faster processing after calibration phase.
# ===============================================================
adaptive_parameters:
  # Enable adaptive parameter selection?
  # true:  Calibrate → optimize → production (faster)
  # false: Use all n_samples on every image (slower, more thorough)
  enabled: true
  
  # Number of images for calibration phase
  # These images test all n_calibration_params to find optimal settings
  n_calibration_images: 2
  
  # Number of parameters to test during calibration
  # Usually same as parameter_space.n_samples
  # If less: uses first N from farthest-point sampling (suboptimal but valid)
  n_calibration_params: 256
  
  # Number of optimized parameters to use in production
  # More parameters = higher diversity coverage
  # Algorithm auto-adjusts diversity weighting based on this value
  n_production_params: 3
  
  # Where to save calibration results for inspection
  calibration_save_path: "Y:\\Group Members\\Valentin Aubry\\01_Data\\Final_Test\\Parameters\\calibration_results.pkl"
  
  # ============================================================
  # CALIBRATION CONTROL
  # ============================================================
  # recalibrate + load_reduced_parameters behavior:
  #
  # false + false: Normal workflow (calibrate, then optimize)
  # false + true:  Skip calibration (load saved optimal parameters)
  # true  + false: Force fresh calibration (ignore existing results)
  # true  + true:  ⚠️ Contradictory (not recommended)
  # ============================================================
  
  # Force fresh calibration even if results exist?
  # Set true if previous calibration was poor or settings changed
  recalibrate: false
  
  # Load pre-saved optimal parameters from previous calibration?
  # Completely skips calibration phase
  # Requires valid .pkl files at paths below
  load_reduced_parameters: false


  # Paths to saved optimal parameters (auto-generated after calibration)
  # Contains ONLY the final 1-3 best parameter combinations (not full calibration data)
  # Only used when load_reduced_parameters: true
  reduced_tritc_path: "Y:\\Group Members\\Valentin Aubry\\01_Data\\Final_Test\\Parameters\\Complete_KDE\\reduced_params_TRITC.pkl"
  reduced_fitc_path: "Y:\\Group Members\\Valentin Aubry\\01_Data\\Final_Test\\Parameters\\Complete_KDE\\reduced_params_FITC.pkl"
  
  # ============================================================
  # RANDOM SEED
  # ============================================================
  # Controls all randomization (image order, parameter sampling, etc.)
  # CRITICAL: Must stay constant across resume runs or image order changes
  # ============================================================
  
  # Randomize image processing order?
  # true:  Shuffle using random_seed (ensures diverse calibration set)
  # false: Process alphabetically by filename
  randomize_calibration_order: true
  
  # Fixed seed for reproducibility (null = random each run)
  # Keep constant for resume functionality to work correctly
  random_seed: 42


# ===============================================================
# WATERSHED THRESHOLDING
# ===============================================================
# Separates touching foci into individual objects.
# Threshold = brightness cutoff where foci regions stop growing.
# ===============================================================
watershed:
  # Threshold selection mode
  # "manual_interactive": Analyze images, show histogram, get user input
  # "manual_preset":      Use fixed thresholds below
  mode: "manual_interactive"
  
  # Number of images to analyze in interactive mode
  # More images = better representation of dataset variability
  n_images_for_threshold: 5
  
  # Fixed thresholds for preset mode (0-100 scale)
  # Pixels above threshold = part of focus region
  manual_threshold_tritc: 20.0
  manual_threshold_fitc: 20.0
  
  # Skip interactive prompts even in interactive mode?
  # Useful for batch processing with predetermined thresholds
  skip_interactive_config: false


# ===============================================================
# VISUALIZATION
# ===============================================================
# Controls generation of overlay images showing detected foci.
# WARNING: "all" mode generates 4 images per position (large storage).
# ===============================================================
visualization:
  # Visualization mode
  # "all":      Every image (slow, large storage)
  # "none":     No visualizations (fastest)
  # "specific": Only images in lists below
  mode: "all"
  
  # Specific images by well/position (format: "WELL_POSITION")
  # Example: ["00029_00035", "00044_00021"]
  # Use [[]] for empty list
  specific_images:
    - []
  
  # Specific images by filename prefix
  # Example: ["ATR1_24h--W00032--P00015--Z00000--T00000--"]
  # Use [[]] for empty list
  specific_basenames:
    - []
  
  # Minimum detection confidence for watershed visualization (0-100%)
  # Foci detected by fewer than this % of parameters are excluded
  # 0 = show all detected foci
  watershed_min_detection_prob: 0.0


# ===============================================================
# TEXTURE FILTERING
# ===============================================================
# Reduces false positives in uniformly bright nuclei.
# Applies stricter criteria to nuclei with low texture variance.
# ===============================================================
texture_filtering:
  # Enable texture-based filtering?
  enabled: true
  
  # Minimum CV (coefficient of variation) for "textured" nucleus
  # CV = std / mean (range 0.0 - 1.0)
  # Nuclei below threshold get stricter filtering
  min_cv_threshold: 0.20
  
  # Contrast multiplier for uniform nuclei (>= 1.0)
  # Example: contrast_threshold × multiplier = adjusted threshold
  # Higher = more aggressive filtering of uniform nuclei
  uniform_contrast_multiplier: 1.0


# ===============================================================
# PROCESSING CONTROL
# ===============================================================
processing:
  # Number of parallel workers (null = auto: CPU_cores - 1, max 8)
  # Reduce if memory errors occur
  max_workers: null
  
  # Maximum images to process (null = all images)
  # Useful for testing or incremental processing
  max_images: null
  
  # Resume from image N (0 = start from beginning)
  # CRITICAL: Keep random_seed constant across resume runs
  #
  # CSV behavior:
  #   resume_from_image > 0: Data appended to existing CSVs
  #   resume_from_image = 0: Prompts if CSVs exist (overwrite/rename/abort)
  resume_from_image: 0


# ===============================================================
# END OF CONFIGURATION
# ===============================================================
# Quick Start:
#   1. Set data.folder_path
#   2. Verify parameter spaces exist or set generate_new: true
#   3. Choose watershed mode
#   4. Configure adaptive_parameters.enabled
#   5. Set random_seed for reproducibility
#   6. Run pipeline
#
# See README.md for detailed documentation and SOP for step-by-step guide.
# ===============================================================